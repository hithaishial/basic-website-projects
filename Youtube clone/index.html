<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: 'Roboto', sans-serif;
    }
    .navbar, .sidebar {
      background-color: #202020;
    }
    .sidebar {
      height: 100vh;
      position: fixed;
      width: 80px;
      text-align: center;
      padding-top: 20px;
    }
    .sidebar a {
      display: block;
      color: #fff;
      margin: 20px 0;
      text-decoration: none;
      font-size: 12px;
    }
    .sidebar i {
      display: block;
      font-size: 20px;
      margin-bottom: 5px;
    }
    .content {
      margin-left: 100px;
      padding: 20px;
    }
    .category-bar {
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 20px;
    }
    .category-bar button {
      background-color: #303030;
      color: #fff;
      border: none;
      margin-right: 10px;
      padding: 8px 16px;
      border-radius: 20px;
    }
    .video-card img {
      width: 100%;
      border-radius: 10px;
    }
    .shorts img {
      width: 100%;
      border-radius: 10px;
    }
    .video-card p {
      font-size: 14px;
      margin-top: 8px;
    }
    .search-box {
      position: relative;
      width: 50%;
    }
    .search-box input {
      padding-right: 40px;
    }
    .search-box .bi-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark px-3 d-flex align-items-center">
    <!-- Hamburger Icon -->
    <i class="bi bi-list text-white fs-3 me-3"></i>
    <!-- YouTube Logo -->
    <a class="navbar-brand d-flex align-items-center" href="#">
      <i class="bi bi-youtube text-danger fs-3 me-2"></i> YouTube
    </a>
    <!-- Search Bar -->
    <form class="d-flex search-box ms-auto me-3">
      <input class="form-control bg-dark text-white" type="search" placeholder="Search">
      <i class="bi bi-search"></i>
    </form>
    <!-- Profile -->
    <img src="images/profile.jpg" alt="Profile" width="35" class="rounded-circle">
  </nav>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="#"><i class="bi bi-house-door-fill"></i>Home</a>
    <a href="#"><i class="bi bi-lightning-fill"></i>Shorts</a>
    <a href="#"><i class="bi bi-collection-play-fill"></i>Subscriptions</a>
    <a href="#"><i class="bi bi-person-circle"></i>You</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <!-- Category Bar -->
    <div class="category-bar">
      <button>All</button>
      <button>Music</button>
      <button>Mixes</button>
      <button>Indian Pop</button>
      <button>Tamil Cinema</button>
      <button>Comedy</button>
      <button>Recently Uploaded</button>
    </div>

    <!-- Video Grid -->
    <div class="row">
      <div class="col-md-4 video-card">
        <img src="images/video1.jpg" alt="Video 1">
        <p>Mix - Aksomaniac - Amsham ft. M.H.R, Bhumi</p>
      </div>
      <div class="col-md-4 video-card">
        <img src="images/video2.jpg" alt="Video 2">
        <p>How to Make the Best Tacos Dorados</p>
      </div>
      <div class="col-md-4 video-card">
        <img src="images/video3.jpg" alt="Video 3">
        <p>Mix - Pavazha Malli | Shruti Haasan</p>
      </div>
    </div>

    
    <h5 class="mt-4">Shorts</h5>
    <div class="row">
      <div class="col-md-3 shorts"><img src="images/short1.jpg" alt="Short 1"></div>
      <div class="col-md-3 shorts"><img src="images/short2.jpg" alt="Short 2"></div>
      <div class="col-md-3 shorts"><img src="images/short3.jpg" alt="Short 3"></div>
      <div class="col-md-3 shorts"><img src="images/short4.jpg" alt="Short 4"></div>
    </div>
  </div>

</body>
</html>
